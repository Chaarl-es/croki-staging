    <script>
      (function () {
        try {
          var stored = localStorage.getItem("croki.theme.v1");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark =
            stored === "dark" ||
            ((stored === "system" || stored == null) && prefersDark);
          var canvas = dark ? "#0B0D0C" : "#FFFFFF";
          var scheme = dark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", scheme);
          document.documentElement.style.colorScheme = scheme;
          document.documentElement.style.setProperty("--canvas", canvas);
          document.documentElement.style.backgroundColor = canvas;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            if (meta.getAttribute("media") === "(display-mode: standalone)") return;
            meta.setAttribute("content", canvas);
          });
        } catch (e) {}
      })();
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener(
          "error",
          function (event) {
            var el = event.target;
            if (
              !el ||
              el.tagName !== "SCRIPT" ||
              !el.src ||
              el.src.indexOf("/_expo/static/js/") === -1
            ) {
              return;
            }
            if (sessionStorage.getItem("croki.sw.bust") === "1") {
              return;
            }
            sessionStorage.setItem("croki.sw.bust", "1");
            var reload = function () {
              location.replace("/");
            };
            navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister();
                  }),
                );
              })
              .then(function () {
                return caches.keys();
              })
              .then(function (keys) {
                return Promise.all(
                  keys.map(function (key) {
                    return caches.delete(key);
                  }),
                );
              })
              .then(reload)
              .catch(reload);
          },
          true,
        );
        window.addEventListener("load", () => {
          fetch("/sw.js", { cache: "no-store" })
            .then((response) => {
              if (!response.ok) return;
              return navigator.serviceWorker.register("/sw.js", {
                updateViaCache: "none",
              });
            })
            .catch(() => {});
        });
      }
    </script>
